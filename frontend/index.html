<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BVC Engineering College Bus Tracker — Amalapuram & Odalarevu</title>
  <meta name="description" content="Real-time bus tracking for BVC Engineering College, Odalarevu & Amalapuram.">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Roboto',sans-serif;background:#e8eaed;height:100vh;overflow:hidden;position:relative}

    /* ── Full-screen map ── */
    #map{position:absolute;inset:0;z-index:0}
    .leaflet-container{font-family:'Roboto',sans-serif}

    /* ── Top search bar (Google Maps style) ── */
    #search-panel{
      position:absolute;top:10px;left:10px;z-index:100;
      width:360px;
    }
    .search-box{
      background:#fff;border-radius:24px;
      box-shadow:0 2px 6px rgba(0,0,0,.3);
      display:flex;align-items:center;gap:8px;
      padding:10px 16px;
      transition:border-radius .2s;
    }
    .search-box.open{border-radius:16px 16px 0 0;box-shadow:0 2px 6px rgba(0,0,0,.3)}
    .search-icon{color:#5f6368;flex-shrink:0}
    #q{
      flex:1;border:none;outline:none;font-size:16px;
      font-family:'Roboto',sans-serif;color:#202124;background:transparent;
    }
    #q::placeholder{color:#9aa0a6}
    .search-clear{
      width:28px;height:28px;border-radius:50%;border:none;background:transparent;
      cursor:pointer;color:#5f6368;display:none;align-items:center;justify-content:center;
      font-size:18px;line-height:1;flex-shrink:0;
    }
    .search-clear:hover{background:#f1f3f4}
    #q:not(:placeholder-shown) ~ .search-clear{display:flex}

    /* suggestions dropdown */
    #sug{
      background:#fff;border-radius:0 0 16px 16px;
      box-shadow:0 4px 8px rgba(0,0,0,.2);
      overflow:hidden;display:none;
    }
    #sug.show{display:block}
    .sug-item{
      display:flex;align-items:center;gap:12px;
      padding:12px 16px;cursor:pointer;
      transition:background .1s;font-size:14px;color:#202124;
    }
    .sug-item:hover{background:#f1f3f4}
    .sug-item-icon{
      width:32px;height:32px;border-radius:50%;background:#e8eaed;
      display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;
    }
    .sug-item-name{font-weight:500}
    .sug-item-sub{font-size:12px;color:#70757a;margin-top:1px}

    /* ── Top-right chips (mode selector) ── */
    #mode-bar{
      position:absolute;top:10px;right:56px;z-index:100;
      display:flex;gap:8px;align-items:center;
    }
    .chip{
      background:#fff;border:none;border-radius:20px;
      padding:8px 16px;font-size:14px;font-family:'Roboto',sans-serif;
      font-weight:500;color:#202124;cursor:pointer;
      box-shadow:0 2px 4px rgba(0,0,0,.25);
      display:flex;align-items:center;gap:6px;
      transition:background .15s,box-shadow .15s;white-space:nowrap;
    }
    .chip:hover{background:#f1f3f4;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .chip.active{background:#1a73e8;color:#fff}

    /* ── Zoom controls (Google style) ── */
    .leaflet-control-zoom{
      border:none !important;box-shadow:0 2px 6px rgba(0,0,0,.3) !important;border-radius:8px !important;
    }
    .leaflet-control-zoom a{
      width:40px !important;height:40px !important;line-height:40px !important;
      font-size:20px !important;color:#5f6368 !important;background:#fff !important;
      border:none !important;
    }
    .leaflet-control-zoom-in{border-radius:8px 8px 0 0 !important}
    .leaflet-control-zoom-out{border-radius:0 0 8px 8px !important}
    .leaflet-control-zoom a:hover{background:#f1f3f4 !important;color:#202124 !important}

    /* ── Bottom info sheet ── */
    #sheet{
      position:absolute;bottom:0;left:0;right:0;z-index:100;
      background:#fff;border-radius:16px 16px 0 0;
      box-shadow:0 -2px 12px rgba(0,0,0,.2);
      transform:translateY(100%);
      transition:transform .3s cubic-bezier(.4,0,.2,1);
      max-height:60vh;display:flex;flex-direction:column;
    }
    #sheet.open{transform:translateY(0)}
    .sheet-handle{
      width:36px;height:4px;background:#dadce0;border-radius:2px;
      margin:10px auto 0;flex-shrink:0;
    }
    #sheet-content{overflow-y:auto;padding:0 16px 24px;flex:1}
    #sheet-content::-webkit-scrollbar{width:4px}
    #sheet-content::-webkit-scrollbar-thumb{background:#dadce0;border-radius:2px}

    /* ── Sheet header ── */
    .sheet-header{
      display:flex;align-items:flex-start;justify-content:space-between;
      padding:14px 0 12px;position:sticky;top:0;background:#fff;z-index:1;
    }
    .sheet-title{font-size:18px;font-weight:500;color:#202124;font-family:'Google Sans',sans-serif}
    .sheet-sub{font-size:13px;color:#70757a;margin-top:2px}
    .sheet-close{
      width:32px;height:32px;border-radius:50%;border:none;background:transparent;
      cursor:pointer;font-size:20px;color:#5f6368;display:flex;align-items:center;justify-content:center;
    }
    .sheet-close:hover{background:#f1f3f4}

    /* ── Route planner panel ── */
    #planner-panel{
      position:absolute;top:10px;left:10px;z-index:200;
      width:360px;background:#fff;border-radius:16px;
      box-shadow:0 2px 8px rgba(0,0,0,.3);
      display:none;flex-direction:column;
    }
    #planner-panel.open{display:flex}
    .planner-header{
      padding:12px 12px 8px;border-bottom:1px solid #e8eaed;
      display:flex;align-items:center;gap:8px;
    }
    .planner-back{
      width:36px;height:36px;border-radius:50%;border:none;background:transparent;
      cursor:pointer;font-size:20px;color:#5f6368;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .planner-back:hover{background:#f1f3f4}
    .planner-inputs{padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px}
    .planner-input-row{
      display:flex;align-items:center;gap:10px;
      background:#f1f3f4;border-radius:8px;padding:10px 12px;
    }
    .planner-input-row svg{color:#70757a;flex-shrink:0}
    .planner-input-row select{
      flex:1;border:none;background:transparent;font-size:14px;
      font-family:'Roboto',sans-serif;color:#202124;outline:none;cursor:pointer;
    }
    .planner-go{
      margin:0 12px 12px;padding:12px;border:none;border-radius:8px;
      background:#1a73e8;color:#fff;font-size:14px;font-weight:500;
      font-family:'Roboto',sans-serif;cursor:pointer;
      transition:background .15s;
    }
    .planner-go:hover{background:#1557b0}

    /* ── Arrival cards ── */
    .arrival-card{
      display:flex;align-items:center;gap:12px;
      padding:12px 0;border-bottom:1px solid #e8eaed;
    }
    .arrival-card:last-child{border-bottom:none}
    .arrival-icon{
      width:42px;height:42px;border-radius:50%;background:#e8f0fe;
      display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
    }
    .arrival-info{flex:1}
    .arrival-title{font-size:14px;font-weight:500;color:#202124}
    .arrival-sub{font-size:12px;color:#70757a;margin-top:2px}
    .arrival-eta{font-size:13px;font-weight:500;text-align:right;white-space:nowrap}
    .eta-soon{color:#137333}
    .eta-mid{color:#e37400}
    .eta-far{color:#1a73e8}

    /* ── Search Algorithm Selector ── */
    .algo-section{padding:0 12px 10px}
    .algo-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .algo-label{font-size:11px;text-transform:uppercase;font-weight:600;color:#5f6368;letter-spacing:.5px}
    .algo-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#f1f3f4;padding:3px;border-radius:10px}
    .algo-btn{
      border:none;background:transparent;padding:7px 2px;font-size:11px;font-weight:500;
      color:#5f6368;border-radius:7px;cursor:pointer;transition:all .15s ease;
      display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Roboto',sans-serif;
    }
    .algo-btn:hover{color:#202124}
    .algo-btn.active{background:#fff;color:#1a73e8;box-shadow:0 1px 4px rgba(0,0,0,.14);font-weight:600}
    .algo-btn[data-algo="bfs"].active{color:#137333}
    .algo-btn[data-algo="dfs"].active{color:#e37400}
    .algo-btn[data-algo="compare"].active{color:#7627bb}
    .algo-icon{font-size:13px;line-height:1}

    .algo-info-card{
      margin-top:8px;padding:8px 10px;background:#f8f9fa;border-left:3px solid #1a73e8;border-radius:0 8px 8px 0;
      font-size:11px;color:#3c4043;transition:all .2s;
    }
    .algo-info-card.bfs{border-left-color:#137333;background:#f6fbf7}
    .algo-info-card.dfs{border-left-color:#e37400;background:#fef9f3}
    .algo-info-card.compare{border-left-color:#7627bb;background:#f9f5fc}
    .algo-badge-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
    .algo-badge{font-weight:600;color:#1a73e8}
    .algo-info-card.bfs .algo-badge{color:#137333}
    .algo-info-card.dfs .algo-badge{color:#e37400}
    .algo-info-card.compare .algo-badge{color:#7627bb}
    .algo-desc{color:#5f6368;line-height:1.35}

    /* ── Path result card ── */
    .path-card{background:#f8f9fa;border-radius:12px;padding:12px;margin-top:8px;box-shadow:inset 0 0 0 1px #e8eaed}
    .path-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
    .metric-box{background:#fff;border-radius:8px;padding:8px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .metric-val{font-size:17px;font-weight:600;color:#202124;font-family:'Google Sans',sans-serif}
    .metric-unit{font-size:11px;font-weight:normal;color:#70757a;margin-left:2px}
    .metric-label{font-size:10px;color:#70757a;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}

    .path-tag-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:10px}
    .algo-tag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:12px;color:#fff;background:#1a73e8}
    .algo-tag.bfs{background:#137333}
    .algo-tag.dfs{background:#e37400}
    .algo-tag.tag-sub{background:#e8eaed;color:#3c4043;font-weight:normal}

    .vis-btn{
      width:100%;margin-bottom:10px;padding:8px 12px;border:1px solid #dadce0;border-radius:8px;
      background:#fff;color:#1a73e8;font-size:12px;font-weight:500;font-family:'Roboto',sans-serif;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;
    }
    .vis-btn:hover{background:#f1f3f4;border-color:#1a73e8}

    .path-stops-header{font-size:11px;font-weight:600;text-transform:uppercase;color:#5f6368;margin-bottom:6px;letter-spacing:.3px}
    .path-stops-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
    .path-stop{font-size:11px;background:#fff;color:#3c4043;padding:4px 8px;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer}
    .path-stop:hover{background:#e8f0fe;color:#1a73e8}
    .path-arrow{color:#9aa0a6;font-size:11px}

    /* ── Comparison View ── */
    .compare-container{margin-top:8px}
    .compare-table{width:100%;border-collapse:collapse;font-size:11px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .compare-table th{background:#f1f3f4;padding:8px 6px;text-align:left;font-weight:600;color:#5f6368}
    .compare-table td{padding:8px 6px;border-top:1px solid #f1f3f4;color:#202124}
    .compare-table tr:hover td{background:#f8f9fa}
    .compare-toggle-bar{display:flex;gap:4px;margin-top:8px}
    .compare-toggle-btn{
      flex:1;padding:6px;font-size:11px;font-weight:500;border:1px solid #dadce0;
      background:#fff;border-radius:6px;cursor:pointer;text-align:center;transition:all .15s;
    }
    .compare-toggle-btn.active{border-color:#1a73e8;background:#e8f0fe;color:#1a73e8;font-weight:600}
    .compare-legend{display:flex;gap:10px;font-size:11px;color:#5f6368;margin-top:8px;justify-content:center}
    .legend-item{display:flex;align-items:center;gap:4px}
    .legend-line{width:16px;height:4px;border-radius:2px}

    /* ── Network Traversal in sheet ── */
    .sheet-section-title{font-size:12px;font-weight:600;text-transform:uppercase;color:#5f6368;margin:16px 0 8px;letter-spacing:.3px}
    .traverse-actions{display:flex;gap:8px;margin-bottom:12px}
    .traverse-btn{
      flex:1;padding:8px;font-size:12px;font-weight:500;border:1px solid #dadce0;background:#fff;
      border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;
    }
    .traverse-btn:hover{background:#f1f3f4}
    .traverse-btn.bfs-color{color:#137333;border-color:#ceead6}
    .traverse-btn.bfs-color:hover{background:#e6f4ea}
    .traverse-btn.dfs-color{color:#e37400;border-color:#fedfc8}
    .traverse-btn.dfs-color:hover{background:#feefe3}

    .traverse-result{background:#f8f9fa;border-radius:8px;padding:10px;font-size:12px}
    .traverse-level-row{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
    .traverse-level-badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:10px;background:#137333;color:#fff;white-space:nowrap}
    .traverse-level-stops{display:flex;flex-wrap:wrap;gap:4px}
    .traverse-stop-pill{font-size:11px;background:#fff;padding:2px 6px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
    .traverse-stop-pill:hover{background:#e8f0fe;color:#1a73e8}

    /* ── Traversal HUD on map ── */
    #traversal-hud{
      position:absolute;top:68px;left:50%;transform:translateX(-50%);
      background:#202124;color:#fff;padding:8px 16px;border-radius:20px;
      font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:900;
      display:none;align-items:center;gap:8px;font-family:'Roboto',sans-serif;
    }
    #traversal-hud.show{display:flex}
    .hud-spinner{width:12px;height:12px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:hudSpin .8s linear infinite}
    @keyframes hudSpin{to{transform:rotate(360deg)}}

    /* ── FAB ── */
    #fab-group{
      position:absolute;bottom:24px;right:16px;z-index:100;
    }
    .fab{
      width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 10px rgba(0,0,0,.3);
      background:#fff;color:#5f6368;font-size:22px;
      transition:box-shadow .2s,transform .15s;
    }
    .fab:hover{box-shadow:0 6px 14px rgba(0,0,0,.4);transform:scale(1.05)}

    /* ── Live badge ── */
    #live-badge{
      position:absolute;top:10px;right:10px;z-index:100;
      background:#fff;border-radius:12px;padding:8px 12px;
      box-shadow:0 2px 6px rgba(0,0,0,.3);
      display:flex;align-items:center;gap:8px;font-size:13px;color:#202124;
    }
    .live-dot{width:8px;height:8px;border-radius:50%;background:#137333;flex-shrink:0;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

    /* ── Bus popup ── */
    .bus-popup{font-family:'Roboto',sans-serif;min-width:160px}
    .bus-popup-title{font-size:15px;font-weight:500;color:#202124;margin-bottom:6px}
    .bus-popup-row{font-size:13px;color:#70757a;display:flex;justify-content:space-between;margin-top:3px}
    .bus-popup-val{color:#202124;font-weight:500}
    .leaflet-popup-content-wrapper{border-radius:12px !important;box-shadow:0 4px 16px rgba(0,0,0,.25) !important;padding:0 !important}
    .leaflet-popup-content{margin:14px 16px !important}

    /* ── My Location dot (Google Maps style) ── */
    .my-loc-outer{
      width:20px;height:20px;
      display:flex;align-items:center;justify-content:center;
      position:relative;
    }
    .my-loc-ring{
      position:absolute;width:20px;height:20px;border-radius:50%;
      background:rgba(26,115,232,.2);
      animation:locRing 1.8s ease-out infinite;
    }
    .my-loc-dot{
      width:12px;height:12px;border-radius:50%;
      background:#1a73e8;border:2.5px solid #fff;
      box-shadow:0 2px 6px rgba(26,115,232,.6);
      position:relative;z-index:1;
    }
    @keyframes locRing{
      0%{transform:scale(.5);opacity:.8}
      100%{transform:scale(2.2);opacity:0}
    }

    /* ── Toast ── */
    #toast{
      position:absolute;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
      background:#202124;color:#fff;padding:10px 20px;border-radius:8px;
      font-size:14px;opacity:0;transition:opacity .25s,transform .25s;
      z-index:999;pointer-events:none;white-space:nowrap;
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:480px){
      #search-panel,#planner-panel{width:calc(100vw - 20px)}
      #mode-bar{display:none}
      #sheet{max-height:70vh}
    }
  </style>
</head>
<body>

<!-- Full-screen map -->
<div id="map"></div>

<!-- Traversal HUD on map -->
<div id="traversal-hud"><div class="hud-spinner"></div><span id="hud-text">Exploring graph...</span></div>

<!-- Search panel -->
<div id="search-panel">
  <div class="search-box" id="search-box">
    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="q" placeholder="Search BVC stops, Amalapuram, Odalarevu..." autocomplete="off">
    <button class="search-clear" id="search-clear" onclick="clearSearch()">&#x2715;</button>
  </div>
  <div id="sug"></div>
</div>

<!-- Mode chips (top right) -->
<div id="mode-bar">
  <button class="chip active" id="chip-buses" onclick="setMode('buses')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M8 5v14M16 5v14"/></svg>
    Live Buses
  </button>
  <button class="chip" id="chip-plan" onclick="openPlanner()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Directions
  </button>
</div>

<!-- Live badge -->
<div id="live-badge">
  <div class="live-dot"></div>
  <span id="bus-count-text">Loading...</span>
</div>

<!-- Route planner panel -->
<div id="planner-panel">
  <div class="planner-header">
    <button class="planner-back" onclick="closePlanner()">&#8592;</button>
    <span style="font-size:16px;font-weight:500;font-family:'Google Sans',sans-serif;color:#202124">Plan a Route</span>
  </div>
  <div class="planner-inputs">
    <div class="planner-input-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      <select id="from"><option value="" disabled selected>From stop...</option></select>
    </div>
    <div class="planner-input-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#1a73e8" stroke="#1a73e8" stroke-width="1"><path d="M12 2a8 8 0 0 1 8 8c0 5.25-8 14-8 14S4 15.25 4 10a8 8 0 0 1 8-8z"/><circle cx="12" cy="10" r="3" fill="#fff" stroke="#fff"/></svg>
      <select id="to"><option value="" disabled selected>To stop...</option></select>
    </div>
  </div>

  <!-- Search Algorithm Selector -->
  <div class="algo-section">
    <div class="algo-header">
      <div class="algo-label">Search Algorithm</div>
    </div>
    <div class="algo-tabs">
      <button class="algo-btn active" data-algo="dijkstra" onclick="selectAlgo('dijkstra')">
        <span class="algo-icon">&#x26A1;</span> Dijkstra
      </button>
      <button class="algo-btn" data-algo="bfs" onclick="selectAlgo('bfs')">
        <span class="algo-icon">&#x1F30C;</span> BFS
      </button>
      <button class="algo-btn" data-algo="dfs" onclick="selectAlgo('dfs')">
        <span class="algo-icon">&#x1F9ED;</span> DFS
      </button>
      <button class="algo-btn" data-algo="compare" onclick="selectAlgo('compare')">
        <span class="algo-icon">&#x1F4CA;</span> Compare
      </button>
    </div>
    <div class="algo-info-card dijkstra" id="algo-info-card">
      <div class="algo-badge-row">
        <span class="algo-badge" id="algo-ds-badge">Min-Heap &middot; O((V+E) log V)</span>
      </div>
      <div class="algo-desc" id="algo-desc">Finds the shortest physical path (minimizing road km distance).</div>
    </div>
  </div>

  <button class="planner-go" id="go" onclick="runPathSearch()">Find Route</button>
  <div id="pres" style="padding:0 12px 12px;overflow-y:auto;max-height:calc(100vh - 360px)"></div>
</div>

<!-- Bottom sheet -->
<div id="sheet">
  <div class="sheet-handle"></div>
  <div id="sheet-content">
    <div class="sheet-header">
      <div>
        <div class="sheet-title" id="sheet-title">Arrivals</div>
        <div class="sheet-sub" id="sheet-sub">Tap a stop on the map</div>
      </div>
      <button class="sheet-close" onclick="closeSheet()">&#x2715;</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<!-- FAB: my location -->
<div id="fab-group">
  <button class="fab" title="Re-center on my location" id="fab-loc"
    onclick="recenterMe()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2.5"><circle cx="12" cy="12" r="3" fill="#1a73e8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7" stroke-dasharray="2 3"/></svg>
  </button>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const J = u => fetch(u).then(r => r.json());

// ── Map setup ─────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false }).setView([16.4500, 81.9300], 12);
L.control.zoom({ position: 'bottomright' }).addTo(map);

// Real Google Maps tile layer (standard roadmap)
const googleRoad = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
  subdomains: '0123',
  maxZoom: 20,
  attribution: '&copy; Google Maps'
}).addTo(map);

let busMarkers = {}, sel = null, myPin = null, myLocMarker = null, routeLine = null, allStops = [], stopMarkers = {};
let currentAlgo = 'dijkstra', lastRouteData = null, comparisonLines = [];
const traversalLayer = L.layerGroup().addTo(map);
let traversalAnimTimer = null;

const ALGO_META = {
  dijkstra: {
    badge: 'Min-Heap &middot; O((V+E) log V)',
    desc: 'Finds the shortest physical path (minimizing road km distance).',
    cls: 'dijkstra',
    color: '#1a73e8'
  },
  bfs: {
    badge: 'Queue (FIFO) &middot; O(V+E)',
    desc: 'Finds the path with the fewest intermediate stops/hops (level-by-level breadth search).',
    cls: 'bfs',
    color: '#137333'
  },
  dfs: {
    badge: 'Stack / Recursion (LIFO) &middot; O(V+E)',
    desc: 'Explores deeply along connected route branches before backtracking.',
    cls: 'dfs',
    color: '#e37400'
  },
  compare: {
    badge: 'Multi-Algorithm Benchmark',
    desc: 'Runs Dijkstra, BFS, and DFS together to compare distance, hops, and nodes explored.',
    cls: 'compare',
    color: '#7627bb'
  }
};

// ── Live location dot (Google Maps blue dot) ──────────────────────────
const myLocIcon = L.divIcon({
  html: `<div class="my-loc-outer"><div class="my-loc-ring"></div><div class="my-loc-dot"></div></div>`,
  className: '', iconSize: [20, 20], iconAnchor: [10, 10]
});

function updateMyLocation(lat, lon, flyTo) {
  if (myLocMarker) {
    myLocMarker.setLatLng([lat, lon]);
  } else {
    myLocMarker = L.marker([lat, lon], { icon: myLocIcon, zIndexOffset: 2000 })
      .addTo(map)
      .bindTooltip('<b>You are here</b>', { direction: 'top', permanent: false });
  }
  if (flyTo) map.flyTo([lat, lon], 16, { duration: 1.5 });
}

// Ask for GPS on page load with timeout and fallbacks
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    p => {
      updateMyLocation(p.coords.latitude, p.coords.longitude, true);
      showToast('Found your location!');
    },
    err => {
      console.warn('GPS error/permission denied:', err.message);
      showToast('Click location button or allow browser GPS permission');
      // IP-based fallback if GPS denied
      fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(d => {
          if (d.latitude && d.longitude && !myLocMarker) {
            updateMyLocation(d.latitude, d.longitude, true);
          }
        }).catch(() => {});
    },
    { enableHighAccuracy: true, timeout: 7000 }
  );

  navigator.geolocation.watchPosition(
    p => updateMyLocation(p.coords.latitude, p.coords.longitude, false),
    () => {},
    { enableHighAccuracy: true }
  );
} else {
  showToast('Geolocation not supported by browser');
}

// ── Icons ─────────────────────────────────────────────────────────────
function makeBusIcon(route) {
  const cols = { 1: '#1a73e8', 2: '#137333', 3: '#9334e6' };
  const c = cols[route] || '#1a73e8';
  return L.divIcon({
    html: `<div style="position:relative;width:36px;height:44px">
      <div style="
        background:${c};color:#fff;
        width:36px;height:36px;border-radius:50% 50% 50% 0;
        transform:rotate(-45deg);
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 3px 10px rgba(0,0,0,.4);
        border:2.5px solid #fff;
      "><span style="transform:rotate(45deg);font-size:16px">&#x1F68C;</span></div>
    </div>`,
    className: '', iconSize: [36, 44], iconAnchor: [18, 44]
  });
}

const stopDot = L.divIcon({
  html: `<div style="width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #1a73e8;box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>`,
  className: '', iconSize: [12, 12], iconAnchor: [6, 6]
});

const stopDotSel = L.divIcon({
  html: `<div style="width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 2px 8px rgba(26,115,232,.7)"></div>`,
  className: '', iconSize: [16, 16], iconAnchor: [8, 8]
});

// ── Init ─────────────────────────────────────────────────────────────
async function init() {
  allStops = await J('/api/stops');
  allStops.forEach(s => {
    const m = L.marker([s.lat, s.lon], { icon: stopDot })
      .addTo(map)
      .bindTooltip(`<b>${s.name}</b>`, { direction: 'top' });
    m.on('click', () => pickStop(s));
    stopMarkers[s.id] = m;
    $('from').add(new Option(s.name, s.id));
    $('to').add(new Option(s.name, s.id));
  });

  const cols = ['#1a73e8', '#137333', '#9334e6'];
  (await J('/api/routes')).forEach((r, i) => {
    const pts = r.stops.map(x => [x.lat, x.lon]);
    pts.push(pts[0]);
    L.polyline(pts, { color: cols[i % 3], weight: 4, opacity: 0.65 }).addTo(map);
  });

  if (allStops.length > 0 && !myLocMarker) {
    const group = L.featureGroup(Object.values(stopMarkers));
    map.fitBounds(group.getBounds().pad(0.15));
  }

  poll();
  setInterval(poll, 1500);
}

// ── Poll ─────────────────────────────────────────────────────────────
async function poll() {
  try {
    const buses = await J('/api/buses');
    $('bus-count-text').textContent = `${buses.length} bus${buses.length !== 1 ? 'es' : ''} \u00b7 live`;
    buses.forEach(b => {
      const popup = `<div class="bus-popup">
        <div class="bus-popup-title">&#x1F68C; ${b.plate}</div>
        <div class="bus-popup-row"><span>Route</span><span class="bus-popup-val">R${b.route}</span></div>
        <div class="bus-popup-row"><span>Speed</span><span class="bus-popup-val">${b.speed.toFixed(1)} km/h</span></div>
        <div class="bus-popup-row"><span>Status</span><span class="bus-popup-val" style="color:#137333">Live</span></div>
      </div>`;
      if (busMarkers[b.id]) {
        busMarkers[b.id].setLatLng([b.lat, b.lon]).getPopup().setContent(popup);
      } else {
        busMarkers[b.id] = L.marker([b.lat, b.lon], { icon: makeBusIcon(b.route), zIndexOffset: 1000 })
          .addTo(map)
          .bindPopup(popup, { maxWidth: 210, closeButton: false });
      }
    });
    if (sel !== null) loadArrivals();
  } catch(e) {}
}

// ── Stop select ───────────────────────────────────────────────────────
function pickStop(s) {
  if (sel !== null && stopMarkers[sel]) stopMarkers[sel].setIcon(stopDot);
  sel = s.id;
  stopMarkers[s.id].setIcon(stopDotSel);
  map.panTo([s.lat, s.lon], { animate: true });
  $('sheet-title').textContent = s.name;
  $('sheet-sub').textContent = 'Bus stop \u00b7 Next arrivals below';
  openSheet();
  loadArrivals();
}

async function loadArrivals() {
  try {
    const arr = await J('/api/arrivals?stop=' + sel);
    const traversalHtml = `
      <div class="sheet-section-title">Network Traversal from this Stop</div>
      <div class="traverse-actions">
        <button class="traverse-btn bfs-color" onclick="runStopTraversal('bfs')">
          <span>&#x1F30C;</span> BFS Reachability
        </button>
        <button class="traverse-btn dfs-color" onclick="runStopTraversal('dfs')">
          <span>&#x1F9ED;</span> DFS Exploration
        </button>
      </div>
      <div id="sheet-traverse-res"></div>
    `;

    if (!arr.length) {
      $('sheet-body').innerHTML = `
        <div style="text-align:center;padding:16px 0;color:#70757a;font-size:14px">No active buses right now</div>
        ${traversalHtml}
      `;
      return;
    }
    const arrivalsHtml = arr.map(x => `
      <div class="arrival-card">
        <div class="arrival-icon">&#x1F68C;</div>
        <div class="arrival-info">
          <div class="arrival-title">${x.plate}</div>
          <div class="arrival-sub">Route R${x.route}</div>
        </div>
        <div class="arrival-eta ${x.eta < 5 ? 'eta-soon' : x.eta < 15 ? 'eta-mid' : 'eta-far'}">
          <div style="font-size:20px;font-weight:500;font-family:'Google Sans',sans-serif">${Math.round(x.eta)}</div>
          <div style="font-size:11px;color:#70757a">min</div>
        </div>
      </div>`).join('');

    $('sheet-body').innerHTML = arrivalsHtml + traversalHtml;
  } catch(e) {}
}

// ── Search ────────────────────────────────────────────────────────────
$('q').addEventListener('input', async e => {
  const v = e.target.value.trim();
  if (!v) { $('sug').className = ''; $('sug').innerHTML = ''; $('search-box').className = 'search-box'; return; }
  $('search-box').className = 'search-box open';
  const res = await J('/api/stops?q=' + encodeURIComponent(v));
  $('sug').className = res.length ? 'show' : '';
  $('sug').innerHTML = res.map(s => `
    <div class="sug-item" onclick="selectStop(${s.id}, '${s.name.replace(/'/g,"\\'")}', ${s.lat}, ${s.lon})">
      <div class="sug-item-icon">&#x1F4CD;</div>
      <div>
        <div class="sug-item-name">${s.name}</div>
        <div class="sug-item-sub">Bus stop</div>
      </div>
    </div>`).join('');
});

function selectStop(id, name, lat, lon) {
  $('q').value = name;
  $('sug').className = ''; $('sug').innerHTML = '';
  $('search-box').className = 'search-box';
  map.flyTo([lat, lon], 17, { duration: 0.8 });
  const s = allStops.find(x => x.id === id);
  if (s) pickStop(s);
}

function clearSearch() {
  $('q').value = ''; $('sug').className = ''; $('sug').innerHTML = '';
  $('search-box').className = 'search-box';
}

// ── Sheet ─────────────────────────────────────────────────────────────
function openSheet() { $('sheet').classList.add('open'); }
function closeSheet() {
  $('sheet').classList.remove('open');
  if (sel !== null && stopMarkers[sel]) stopMarkers[sel].setIcon(stopDot);
  sel = null;
  clearTraversal();
  const resEl = $('sheet-traverse-res');
  if (resEl) resEl.innerHTML = '';
}

// ── Nearest ───────────────────────────────────────────────────────────
async function nearestTo(lat, lon) {
  if (myPin) map.removeLayer(myPin);
  myPin = L.circleMarker([lat, lon], {
    radius: 9, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 1, weight: 3, opacity: 0.5
  }).addTo(map).bindTooltip('<b>You</b>', { permanent: true, direction: 'top' }).openTooltip();
  map.flyTo([lat, lon], 15, { duration: 0.8 });
  try {
    const b = await J(`/api/nearest?lat=${lat}&lon=${lon}`);
    if (!b) { showToast('No buses found nearby'); return; }
    $('sheet-title').textContent = b.plate;
    $('sheet-sub').textContent = `Nearest bus \u00b7 ${(b.km * 1000).toFixed(0)} m away`;
    $('sheet-body').innerHTML = `
      <div class="arrival-card">
        <div class="arrival-icon">&#x1F68C;</div>
        <div class="arrival-info">
          <div class="arrival-title">${b.plate}</div>
          <div class="arrival-sub">Route R${b.route} \u00b7 ${b.speed.toFixed(1)} km/h</div>
        </div>
        <div class="arrival-eta eta-soon">
          <div style="font-size:18px;font-weight:500;font-family:'Google Sans',sans-serif">${(b.km*1000).toFixed(0)}</div>
          <div style="font-size:11px;color:#70757a">m away</div>
        </div>
      </div>`;
    openSheet();
  } catch(e) {}
}

map.on('click', e => {
  if ($('planner-panel').classList.contains('open')) return;
  nearestTo(e.latlng.lat, e.latlng.lng);
});

// ── Planner ───────────────────────────────────────────────────────────
function setMode(m) {
  $('chip-buses').classList.toggle('active', m === 'buses');
  $('chip-plan').classList.toggle('active', m === 'plan');
}
function openPlanner() {
  setMode('plan');
  $('search-panel').style.display = 'none';
  $('planner-panel').classList.add('open');
  closeSheet();
}
function closePlanner() {
  setMode('buses');
  $('search-panel').style.display = '';
  $('planner-panel').classList.remove('open');
  $('pres').innerHTML = '';
  clearRouteLines();
  clearTraversal();
}

function selectAlgo(algo) {
  currentAlgo = algo;
  document.querySelectorAll('.algo-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-algo') === algo);
  });
  const info = ALGO_META[algo] || ALGO_META.dijkstra;
  const card = $('algo-info-card');
  card.className = `algo-info-card ${info.cls}`;
  $('algo-ds-badge').innerHTML = info.badge;
  $('algo-desc').textContent = info.desc;

  const from = $('from').value, to = $('to').value;
  if (from && to && from !== to && $('pres').innerHTML.trim()) {
    runPathSearch();
  }
}

function clearRouteLines() {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  comparisonLines.forEach(l => map.removeLayer(l));
  comparisonLines = [];
}

function clearTraversal() {
  if (traversalAnimTimer) {
    clearInterval(traversalAnimTimer);
    traversalAnimTimer = null;
  }
  traversalLayer.clearLayers();
  $('traversal-hud').classList.remove('show');
}

async function runPathSearch() {
  const from = $('from').value, to = $('to').value;
  if (!from || !to) { showToast('Select both stops first'); return; }
  if (from === to) { showToast('Choose different stops'); return; }

  clearRouteLines();
  clearTraversal();

  const goBtn = $('go');
  goBtn.disabled = true;
  goBtn.textContent = 'Searching route...';

  try {
    const res = await J(`/api/path?from=${from}&to=${to}&algo=${currentAlgo}`);
    goBtn.disabled = false;
    goBtn.textContent = 'Find Route';

    if (!res || (res.found === false && !res.compare)) {
      $('pres').innerHTML = `<div style="color:#c5221f;font-size:14px;padding:8px 0">No connected route found between these stops.</div>`;
      return;
    }

    lastRouteData = res;

    if (res.compare) {
      renderCompareView(res);
    } else {
      renderSingleAlgoView(res);
    }
  } catch(e) {
    goBtn.disabled = false;
    goBtn.textContent = 'Find Route';
    showToast('Error calculating route');
  }
}

function renderSingleAlgoView(p) {
  clearRouteLines();
  const stopMap = Object.fromEntries(allStops.map(s => [s.name, s]));
  const pts = p.stops.map(n => stopMap[n] ? [stopMap[n].lat, stopMap[n].lon] : null).filter(Boolean);

  if (pts.length) {
    routeLine = L.polyline(pts, {
      color: p.color || '#1a73e8',
      weight: 6,
      opacity: 0.85,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);
    map.flyToBounds(routeLine.getBounds(), { padding: [60, 60], duration: 1 });
  }

  const algoClass = p.algo === 'bfs' ? 'bfs' : p.algo === 'dfs' ? 'dfs' : '';

  $('pres').innerHTML = `
    <div class="path-card">
      <div class="path-metrics">
        <div class="metric-box">
          <div class="metric-val">${p.km.toFixed(2)}<span class="metric-unit">km</span></div>
          <div class="metric-label">Distance</div>
        </div>
        <div class="metric-box">
          <div class="metric-val">${p.hops}</div>
          <div class="metric-label">Stops/Hops</div>
        </div>
        <div class="metric-box">
          <div class="metric-val">${p.visited_count}</div>
          <div class="metric-label">Explored</div>
        </div>
      </div>

      <div class="path-tag-row">
        <span class="algo-tag ${algoClass}">${p.full_name || p.algo_name}</span>
        <span class="algo-tag tag-sub">${p.ds}</span>
        <span class="algo-tag tag-sub">${p.complexity}</span>
      </div>

      <button class="vis-btn" onclick="animateTraversal('${p.algo}')">
        <span>&#x25B6;</span> Visualize ${p.algo.toUpperCase()} Traversal
      </button>

      <div class="path-stops-header">Route Sequence (${p.stops.length} stops)</div>
      <div class="path-stops-row">
        ${p.stops.map((s, i) => `
          ${i > 0 ? '<span class="path-arrow">&rsaquo;</span>' : ''}
          <span class="path-stop" onclick="focusStopByName('${s.replace(/'/g, "\\'")}')">${s}</span>
        `).join('')}
      </div>
    </div>
  `;
}

function renderCompareView(data) {
  clearRouteLines();
  const d = data.dijkstra;
  const b = data.bfs;
  const f = data.dfs;
  const stopMap = Object.fromEntries(allStops.map(s => [s.name, s]));

  const dPts = d.stops.map(n => stopMap[n] ? [stopMap[n].lat, stopMap[n].lon] : null).filter(Boolean);
  const bPts = b.stops.map(n => stopMap[n] ? [stopMap[n].lat, stopMap[n].lon] : null).filter(Boolean);
  const fPts = f.stops.map(n => stopMap[n] ? [stopMap[n].lat, stopMap[n].lon] : null).filter(Boolean);

  const lDijkstra = L.polyline(dPts, { color: '#1a73e8', weight: 6, opacity: 0.85 });
  const lBfs = L.polyline(bPts, { color: '#137333', weight: 5, opacity: 0.85, dashArray: '6,6' });
  const lDfs = L.polyline(fPts, { color: '#e37400', weight: 4, opacity: 0.8, dashArray: '3,6' });

  comparisonLines = [lDijkstra, lBfs, lDfs];
  lDijkstra.addTo(map);
  lBfs.addTo(map);
  lDfs.addTo(map);

  if (dPts.length) {
    map.flyToBounds(lDijkstra.getBounds(), { padding: [60, 60], duration: 1 });
  }

  $('pres').innerHTML = `
    <div class="compare-container">
      <table class="compare-table">
        <thead>
          <tr>
            <th>Algorithm</th>
            <th>Distance</th>
            <th>Hops</th>
            <th>Visited</th>
          </tr>
        </thead>
        <tbody>
          <tr style="color:#1a73e8;font-weight:600">
            <td>&#x26A1; Dijkstra</td>
            <td>${d.km.toFixed(2)} km <span style="font-size:10px;color:#137333">&#x2714; min</span></td>
            <td>${d.hops}</td>
            <td>${d.visited_count}</td>
          </tr>
          <tr style="color:#137333;font-weight:600">
            <td>&#x1F30C; BFS</td>
            <td>${b.km.toFixed(2)} km</td>
            <td>${b.hops} <span style="font-size:10px;color:#137333">&#x2714; fewest</span></td>
            <td>${b.visited_count}</td>
          </tr>
          <tr style="color:#e37400;font-weight:600">
            <td>&#x1F9ED; DFS</td>
            <td>${f.km.toFixed(2)} km</td>
            <td>${f.hops}</td>
            <td>${f.visited_count}</td>
          </tr>
        </tbody>
      </table>

      <div class="compare-toggle-bar">
        <button class="compare-toggle-btn active" onclick="setCompareLayer('all', this)">All Overlaid</button>
        <button class="compare-toggle-btn" onclick="setCompareLayer('dijkstra', this)">Dijkstra</button>
        <button class="compare-toggle-btn" onclick="setCompareLayer('bfs', this)">BFS</button>
        <button class="compare-toggle-btn" onclick="setCompareLayer('dfs', this)">DFS</button>
      </div>

      <div class="compare-legend">
        <div class="legend-item"><div class="legend-line" style="background:#1a73e8"></div> Dijkstra</div>
        <div class="legend-item"><div class="legend-line" style="background:#137333;border-top:1px dashed #fff"></div> BFS</div>
        <div class="legend-item"><div class="legend-line" style="background:#e37400;border-top:1px dotted #fff"></div> DFS</div>
      </div>
    </div>
  `;
}

function setCompareLayer(mode, btn) {
  document.querySelectorAll('.compare-toggle-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const [lDijkstra, lBfs, lDfs] = comparisonLines;
  if (!lDijkstra) return;

  map.removeLayer(lDijkstra);
  map.removeLayer(lBfs);
  map.removeLayer(lDfs);

  if (mode === 'all') {
    lDijkstra.addTo(map);
    lBfs.addTo(map);
    lDfs.addTo(map);
  } else if (mode === 'dijkstra') {
    lDijkstra.addTo(map);
  } else if (mode === 'bfs') {
    lBfs.addTo(map);
  } else if (mode === 'dfs') {
    lDfs.addTo(map);
  }
}

function animateTraversal(algo) {
  clearTraversal();
  const p = lastRouteData && lastRouteData.compare ? lastRouteData[algo] : lastRouteData;
  if (!p || !p.visited_ids || !p.visited_ids.length) {
    showToast('No traversal sequence available');
    return;
  }

  const stopMapById = Object.fromEntries(allStops.map(s => [s.id, s]));
  const visitedIds = p.visited_ids;
  const colors = { dijkstra: '#1a73e8', bfs: '#137333', dfs: '#e37400' };
  const color = colors[algo] || '#1a73e8';

  const hud = $('traversal-hud');
  const hudText = $('hud-text');
  hud.classList.add('show');

  if (routeLine) map.removeLayer(routeLine);

  let step = 0;
  traversalAnimTimer = setInterval(() => {
    if (step >= visitedIds.length) {
      clearInterval(traversalAnimTimer);
      traversalAnimTimer = null;
      hudText.innerHTML = `&#x2714; ${algo.toUpperCase()} complete! Reached target in ${visitedIds.length} node explorations.`;
      setTimeout(() => {
        hud.classList.remove('show');
        if (routeLine) routeLine.addTo(map);
      }, 2500);
      return;
    }

    const sid = visitedIds[step];
    const s = stopMapById[sid];
    step++;

    if (s) {
      hudText.textContent = `[${algo.toUpperCase()}] Step ${step}/${visitedIds.length}: Exploring ${s.name}`;

      const pulseDot = L.circleMarker([s.lat, s.lon], {
        radius: 9,
        color: color,
        fillColor: color,
        fillOpacity: 0.9,
        weight: 3
      }).addTo(traversalLayer).bindTooltip(`<b>#${step}</b> ${s.name}`, { direction: 'top', permanent: true });
      pulseDot.openTooltip();
    }
  }, 230);
}

function focusStopByName(name) {
  const s = allStops.find(x => x.name === name);
  if (s) {
    map.flyTo([s.lat, s.lon], 16, { duration: 0.8 });
    if (stopMarkers[s.id]) {
      stopMarkers[s.id].openTooltip();
    }
  }
}

async function runStopTraversal(algo) {
  if (sel === null) return;
  const resEl = $('sheet-traverse-res');
  resEl.innerHTML = `<div style="text-align:center;padding:12px;color:#70757a;font-size:12px"><div class="hud-spinner" style="display:inline-block;border-color:#1a73e8;border-top-color:transparent;margin-right:6px"></div> Running ${algo.toUpperCase()} traversal...</div>`;

  clearTraversal();

  try {
    const data = await J(`/api/traverse?stop=${sel}&algo=${algo}`);
    if (!data) { resEl.innerHTML = '<div style="color:#c5221f;font-size:12px">No network data available.</div>'; return; }

    if (algo === 'bfs') {
      const levels = data.levels || {};
      const levelKeys = Object.keys(levels).sort((a,b) => Number(a) - Number(b));

      let html = `<div class="traverse-result">`;
      levelKeys.forEach(lvl => {
        const sList = levels[lvl];
        const lvlName = lvl === '0' ? 'Origin' : `${lvl} Hop${lvl !== '1' ? 's' : ''} Away`;
        html += `
          <div class="traverse-level-row">
            <span class="traverse-level-badge">${lvlName}</span>
            <div class="traverse-level-stops">
              ${sList.map(st => `<span class="traverse-stop-pill" onclick="focusStopByName('${st.name.replace(/'/g, "\\'")}')">${st.name}</span>`).join('')}
            </div>
          </div>
        `;
      });
      html += `</div>`;
      resEl.innerHTML = html;

      const levelColors = ['#1a73e8', '#137333', '#e37400', '#9334e6', '#c5221f'];
      levelKeys.forEach(lvl => {
        const c = levelColors[Number(lvl) % levelColors.length];
        levels[lvl].forEach(st => {
          L.circleMarker([st.lat, st.lon], {
            radius: 8 + (5 - Math.min(Number(lvl), 4)),
            color: c,
            fillColor: c,
            fillOpacity: 0.85,
            weight: 2
          }).addTo(traversalLayer).bindTooltip(`<b>Level ${lvl}</b>: ${st.name}`, { direction: 'top' });
        });
      });
      showToast(`BFS Reachability: explored ${data.order.length} stops`);
    } else {
      const order = data.order || [];
      resEl.innerHTML = `
        <div class="traverse-result">
          <div style="font-weight:600;margin-bottom:6px;color:#e37400">DFS Traversal Order (${order.length} stops):</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${order.map((st, i) => `<span class="traverse-stop-pill" onclick="focusStopByName('${st.name.replace(/'/g, "\\'")}')"><b>${i+1}.</b> ${st.name}</span>`).join('')}
          </div>
        </div>
      `;

      const pts = order.map(st => [st.lat, st.lon]);
      const dfsLine = L.polyline(pts, { color: '#e37400', weight: 4, opacity: 0.8, dashArray: '5,5' }).addTo(traversalLayer);
      map.flyToBounds(dfsLine.getBounds(), { padding: [40, 40], duration: 1 });
      showToast(`DFS Tree: ${order.length} stops traversed`);
    }
  } catch(e) {
    resEl.innerHTML = '<div style="color:#c5221f;font-size:12px">Error exploring network.</div>';
  }
}

// ── Toast ─────────────────────────────────────────────────────────────
let _tt;
function showToast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Re-center on my location ───────────────────────────────────────────
function recenterMe() {
  if (myLocMarker) {
    map.flyTo(myLocMarker.getLatLng(), 16, { duration: 1 });
    myLocMarker.openTooltip();
  } else {
    navigator.geolocation.getCurrentPosition(
      p => { updateMyLocation(p.coords.latitude, p.coords.longitude, true); showToast('Located you!'); },
      () => showToast('Allow location access in your browser')
    );
  }
}

init();

</script>
